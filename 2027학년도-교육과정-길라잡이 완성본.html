<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title id="pageTitle">교육과정 길라잡이</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --paper:#F4F6FB; --card:#fff; --soft:#FAFBFD;
  --ink:#26303F; --ink2:#4A5666; --muted:#7C8899; --line:#E6EBF3;
  --common:#5083CE; --major:#2FA189; --choice:#E2924A; --ncs:#C071A0; --extra:#8E9AAB;
  --g1:#3FB08F; --g2:#6C9BE0; --g3:#A98BD6;
  --sh1:0 1px 2px rgba(38,48,63,.04);
  --sh2:0 4px 16px rgba(38,48,63,.07);
  --sh3:0 12px 34px rgba(38,48,63,.11);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);
  font-family:"Pretendard","Pretendard Variable",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:17.5px;line-height:1.65;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;text-align:left}
:focus-visible{outline:3px solid #F5C36B;outline-offset:2px;border-radius:8px}
.link{font-weight:600;color:var(--common);text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1.5px}

/* shell */
.top{position:sticky;top:0;z-index:40;background:rgba(244,246,251,.9);backdrop-filter:blur(10px)}
.top .in{max-width:1320px;margin:0 auto;padding:14px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;font-weight:700}
.brand .mk{width:26px;height:26px;border-radius:9px;background:linear-gradient(140deg,var(--g1),var(--g2));flex:none}
.brand b{font-size:19px;letter-spacing:-.02em}
.brand span{font-size:14px;color:var(--muted);font-weight:500}
.top nav{margin-left:auto;display:flex;gap:5px}
.top nav button{padding:9px 17px;border-radius:999px;font-size:15px;font-weight:600;color:var(--ink2);background:#fff;box-shadow:var(--sh1)}
.top nav button:hover{box-shadow:var(--sh2)}
.top nav button.on{background:var(--ink);color:#fff}

main{max-width:1320px;margin:0 auto;padding:24px 16px 104px}
.crumb{display:flex;align-items:center;gap:7px;font-size:15px;color:var(--muted);margin-bottom:16px;flex-wrap:wrap}
.crumb button{font-weight:600;color:var(--ink2)}
.crumb button:hover{color:var(--common)}
.crumb i{font-style:normal;opacity:.45}

h1{font-size:clamp(32px,4.4vw,52px);line-height:1.18;letter-spacing:-.04em;font-weight:800;margin:0 0 12px}
h2{font-size:26px;letter-spacing:-.03em;font-weight:800;margin:40px 0 14px}
h3{font-size:19px;font-weight:700;margin:0 0 9px;letter-spacing:-.025em}
p.lead{color:var(--ink2);max-width:62ch;margin:0 0 28px;font-size:19.5px;line-height:1.6}
p.eyebrow{margin:0 0 8px;font-size:16px;font-weight:700;color:var(--common);letter-spacing:-.01em}

/* home */
.grades{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.gcard{background:var(--card);border-radius:24px;padding:26px 24px 22px;box-shadow:var(--sh2);display:flex;flex-direction:column;
  transition:transform .18s ease,box-shadow .18s ease}
.gcard:hover{transform:translateY(-3px);box-shadow:var(--sh3)}
.gcard .badge{width:58px;height:58px;border-radius:20px;display:flex;align-items:center;justify-content:center;
  font-size:25px;font-weight:800;color:#fff;letter-spacing:-.04em;margin-bottom:16px}
.gcard .n{font-size:27px;font-weight:800;letter-spacing:-.035em;line-height:1.2}
.gcard .sub{font-size:15.5px;color:var(--muted);margin-top:2px}
.gcard .map{margin-top:16px;padding:12px 15px;border-radius:14px;background:var(--soft);font-size:15.5px;color:var(--ink2)}
.gcard .map b{color:var(--ink)}
.gcard .depts{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:14px;font-weight:600;padding:5px 12px;border-radius:999px;background:#EEF2F9;color:var(--ink2)}

.facts{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(155px,1fr))}
.fact{background:var(--card);border-radius:18px;padding:18px;box-shadow:var(--sh1)}
.fact .v{font-size:30px;font-weight:800;letter-spacing:-.035em;line-height:1.2}
.fact .k{font-size:15px;color:var(--muted);margin-top:3px}

.tip{background:#FFF7EC;border-radius:18px;padding:17px 20px;font-size:16px;color:#7A5620;margin:16px 0}
.tip b{color:#5C3E12}

/* dept list */
.dgroup{margin-bottom:30px}
.dgroup .hd{margin-bottom:12px}
.dgroup .hd h3{margin:0;font-size:21px}
.dgroup .hd small{color:var(--muted);font-size:13.5px}
.dlist{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.dcard{background:var(--card);border-radius:20px;padding:20px;box-shadow:var(--sh1);transition:transform .16s,box-shadow .16s}
.dcard:hover{transform:translateY(-2px);box-shadow:var(--sh2)}
.dcard .t{font-weight:800;font-size:20px;letter-spacing:-.025em}
.dcard .c{font-size:15px;color:var(--muted);margin-top:3px}
.dcard .meta{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:15px;color:var(--ink2)}

/* tabs */
.tabs{display:flex;gap:6px;margin:20px 0 22px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{padding:10px 18px;border-radius:999px;font-size:16px;font-weight:600;color:var(--ink2);white-space:nowrap;background:#fff;box-shadow:var(--sh1)}
.tabs button.on{background:var(--ink);color:#fff}

.panel{background:var(--card);border-radius:20px;padding:24px;margin-bottom:16px;box-shadow:var(--sh1)}
.panel>h3:first-child{margin-top:0}
.hint{font-size:15.5px;color:var(--muted);margin:0 0 16px;max-width:66ch}

/* credit stack */
.stack{display:flex;height:44px;border-radius:12px;overflow:hidden}
.stack div{display:flex;align-items:center;justify-content:center;color:#fff;font-size:14.5px;font-weight:700}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:15px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:7px}
.dot{width:10px;height:10px;border-radius:4px}

/* semesters */
.sems{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(196px,1fr))}
.sem{background:var(--soft);border-radius:18px;padding:14px}
.sem .hd{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.sem .hd b{font-size:16px;letter-spacing:-.02em}
.sem .hd em{font-style:normal;font-size:14px;font-weight:700;color:var(--muted)}
.sub{display:flex;align-items:center;gap:8px;padding:9px 11px;border-radius:11px;background:#fff;margin-bottom:6px;
  font-size:15px;line-height:1.4;width:100%;box-shadow:var(--sh1);transition:transform .12s}
.sub:hover{transform:translateX(2px)}
.sub .tick{width:4px;align-self:stretch;border-radius:3px;flex:none;min-height:20px}
.sub .cr{margin-left:auto;font-weight:700;font-size:14px;color:var(--muted);flex:none}
.sub.pick{background:#FFF8EE}

/* table */
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.tools input{border:0;border-radius:12px;padding:12px 16px;font:inherit;font-size:16px;min-width:200px;flex:1;background:var(--soft);box-shadow:inset 0 0 0 1px var(--line)}
.tools input:focus{box-shadow:inset 0 0 0 2px var(--common);outline:none}
.chip{font-size:15px;font-weight:600;padding:9px 15px;border-radius:999px;background:var(--soft);color:var(--ink2)}
.chip.on{background:var(--ink);color:#fff}
.tw{overflow-x:auto;border-radius:16px;background:#fff;box-shadow:inset 0 0 0 1px var(--line)}
table{border-collapse:collapse;width:100%;font-size:15px;min-width:760px}
th,td{padding:11px 13px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
thead th{background:var(--soft);font-size:13.5px;font-weight:700;color:var(--muted);white-space:nowrap;border-bottom:1px solid var(--line)}
td.num,th.num{text-align:center;width:52px}
tr.grp td{background:#F2F5FA;font-weight:700;font-size:14.5px}
tr.row:hover td{background:#FAFCFF}
.namebtn{font-weight:600;color:var(--ink);border-bottom:1px dashed var(--line)}
.namebtn:hover{color:var(--common);border-color:var(--common)}
.tag{display:inline-block;font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;color:#fff}

/* options */
.opts{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(275px,1fr))}
.opt{background:#fff;border-radius:20px;padding:18px;box-shadow:inset 0 0 0 1.5px var(--line);transition:box-shadow .16s,transform .16s}
.opt:hover{transform:translateY(-2px);box-shadow:inset 0 0 0 1.5px #C9D6E6,var(--sh2)}
.opt.on{box-shadow:inset 0 0 0 2px var(--choice),0 6px 20px rgba(226,146,74,.18)}
.opt .t{font-weight:800;font-size:18px;letter-spacing:-.02em;display:flex;align-items:center;gap:9px}
.opt .mark{width:19px;height:19px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--line);flex:none}
.opt.on .mark{background:var(--choice);box-shadow:inset 0 0 0 3.5px #fff,0 0 0 2px var(--choice)}
.opt ul{margin:13px 0 0;padding:0;list-style:none;font-size:15px}
.opt li{display:flex;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.opt li b{margin-left:auto;font-weight:700;color:var(--muted);flex:none}
.opt .foot{margin-top:13px;padding-top:11px;border-top:1px solid var(--line);font-size:14.5px;color:var(--muted)}

.tray{position:sticky;bottom:0;z-index:30;margin:24px -20px -100px;padding:14px 20px 22px;
  background:linear-gradient(180deg,rgba(244,246,251,0),var(--paper) 26%)}
.tray .in{background:var(--ink);color:#fff;border-radius:20px;padding:16px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;box-shadow:var(--sh3)}
.tray b{font-size:17px}
.tray .s{font-size:15px;opacity:.8;margin-top:2px}
.tray .act{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.tray .act button{background:rgba(255,255,255,.15);color:#fff;padding:10px 16px;border-radius:12px;font-size:15px;font-weight:600}
.tray .act button:hover{background:rgba(255,255,255,.26)}

/* glossary */
.terms{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.term{background:var(--card);border-radius:20px;padding:20px;box-shadow:var(--sh1)}
.term h3{font-size:18px;margin-bottom:7px}
.term p{margin:0;font-size:16px;color:var(--ink2)}
.term p+p{margin-top:9px;color:var(--muted)}

/* subject sheet */
.scrim{position:fixed;inset:0;background:rgba(38,48,63,.35);z-index:60;display:flex;align-items:flex-end;justify-content:center;
  backdrop-filter:blur(2px)}
.sheet{background:#fff;width:100%;max-width:620px;border-radius:26px 26px 0 0;padding:24px 24px 30px;max-height:82vh;overflow:auto;
  box-shadow:var(--sh3);animation:up .22s ease}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
.sheet .close{position:absolute;top:14px;right:16px}
.sheet .kicker{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}
.sheet h3{font-size:25px;letter-spacing:-.03em;margin-bottom:10px}
.sheet .body{font-size:17px;color:var(--ink2);line-height:1.7}
.sheet .body p{margin:0 0 10px}
.sheet .meta{margin-top:18px;padding-top:16px;border-top:1px solid var(--line);font-size:15.5px;color:var(--muted)}
.sheet .units{margin:12px 0 0;padding:0;list-style:none}
.sheet .units li{padding:10px 13px;border-radius:12px;background:var(--soft);margin-bottom:6px;font-size:15.5px;display:flex;gap:10px}
.sheet .units li span{margin-left:auto;font-size:12px;color:var(--muted);flex:none}
.sheetbtn{margin-top:20px;width:100%;text-align:center;background:var(--ink);color:#fff;padding:13px;border-radius:14px;font-weight:700}
@media (min-width:640px){
  .scrim{align-items:center}
  .sheet{border-radius:26px;max-height:78vh}
}

/* 골라야 할 게 있다는 안내 */
.callout{display:flex;gap:16px;align-items:center;flex-wrap:wrap;background:#FFF3E2;border-radius:20px;
  padding:18px 22px;margin:0 0 20px;box-shadow:inset 0 0 0 2.5px #EFC286}
.callout .ic{width:46px;height:46px;border-radius:15px;background:var(--choice);color:#fff;flex:none;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:21px}
.callout .tx b{display:block;font-size:19px;color:#7A5620;letter-spacing:-.02em}
.callout .tx span{font-size:15.5px;color:#946B2A}
.callout .cta{margin-left:auto;background:var(--choice);color:#fff;padding:14px 24px;border-radius:14px;
  font-weight:700;font-size:16.5px;white-space:nowrap;box-shadow:var(--sh2)}
.callout .cta:hover{filter:brightness(.94)}
.callout.done{background:#EAF7F1;box-shadow:inset 0 0 0 2.5px #A5DBC5}
.callout.done .ic,.callout.done .cta{background:var(--major)}
.callout.done .tx b{color:#1B6B54} .callout.done .tx span{color:#2E8268}
.callout.shut{background:#F1F4F9;box-shadow:inset 0 0 0 2.5px #D5DDE8}
.callout.shut .ic,.callout.shut .cta{background:var(--extra)}
.callout.shut .tx b{color:var(--ink)} .callout.shut .tx span{color:var(--muted)}
@media (max-width:560px){ .callout .cta{margin-left:0;width:100%;text-align:center} }

.tabs button.alert{background:var(--choice);color:#fff}
.tabs button.alert .tag{background:rgba(255,255,255,.28)!important}
.panel.todo{box-shadow:inset 0 0 0 2.5px #EFC286}
.panel.picked{box-shadow:inset 0 0 0 2.5px #A5DBC5}
.steptag{display:inline-flex;align-items:center;gap:7px;font-size:14.5px;font-weight:700;color:#8A5A17;
  background:#FFF3E2;padding:5px 13px;border-radius:999px;margin-bottom:11px}
.panel.picked .steptag{color:#1B6B54;background:#EAF7F1}
.dcard .go{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--choice);color:#fff;
  padding:10px 16px;border-radius:12px;font-weight:700;font-size:15px}
.dcard .go.done{background:var(--major)}

/* 제출 폼 */
.fstep{display:flex;gap:13px;align-items:center;margin:26px 0 12px}
.fstep:first-of-type{margin-top:6px}
.fstep .no{width:32px;height:32px;border-radius:50%;background:#C9D3E0;color:#fff;flex:none;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px}
.fstep .ttl{font-size:18px;font-weight:700;letter-spacing:-.02em}
.fstep .ttl em{font-style:normal;font-size:14.5px;font-weight:600;color:#A56A15;margin-left:8px}
.fstep.ok .no{background:var(--major)}
.fstep.ok .ttl em{color:var(--major)}
.field{border-radius:16px;padding:16px;background:#FFF9F0;box-shadow:inset 0 0 0 2.5px #EFC286}
.field.ok{background:transparent;box-shadow:none;padding:0}
.miss{margin:16px 0 0;border-radius:14px;background:#FFF3E2;padding:14px 17px;font-size:15.5px;color:#8A5A17;font-weight:600}
.miss.ok{display:none}
.locked{background:#F1F4F9;border-radius:18px;padding:17px 20px;font-size:16px;color:var(--ink2);margin-bottom:16px}
.locked b{color:var(--ink)}
.form label{display:block;font-size:15px;font-weight:700;color:var(--ink2);margin:0 0 6px}
.frow{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));margin-bottom:18px}
.form input[type=text]{width:100%;border:0;border-radius:12px;padding:14px 16px;font:inherit;font-size:17.5px;background:var(--soft);box-shadow:inset 0 0 0 1px var(--line)}
.form input[type=text]:focus{box-shadow:inset 0 0 0 2px var(--common);outline:none}
.agree{display:flex;gap:12px;align-items:flex-start;padding:15px 17px;border-radius:14px;background:var(--soft);margin-bottom:10px;cursor:pointer;font-size:16px;line-height:1.6}
.agree input{width:22px;height:22px;margin:2px 0 0;flex:none;accent-color:var(--major);cursor:pointer}
.sigbox{border-radius:14px;background:#fff;box-shadow:inset 0 0 0 1.5px var(--line);position:relative;overflow:hidden}
.sigbox canvas{display:block;width:100%;height:160px;touch-action:none;cursor:crosshair}
.sigbox .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#B9C4D3;font-size:14px;pointer-events:none}
.sigbox .ph.hide{display:none}
.sigbar{display:flex;justify-content:space-between;align-items:center;margin-top:9px;font-size:13px;color:var(--muted)}
.big{width:100%;text-align:center;padding:18px;border-radius:16px;font-size:18px;font-weight:700;background:var(--major);color:#fff;margin-top:20px;box-shadow:var(--sh2)}
.big[disabled]{background:#D5DDE8;color:#8C99AA;cursor:not-allowed;box-shadow:none}
.big.ghost{background:#fff;color:var(--ink2);box-shadow:inset 0 0 0 1.5px var(--line);font-size:16.5px;padding:15px}

/* 제출 확인서 */
.receipt{border-radius:20px;background:#fff;padding:28px;box-shadow:var(--sh1)}
.receipt .rh{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;
  padding-bottom:18px;margin-bottom:18px;border-bottom:2px solid var(--ink)}
.receipt .rh h3{font-size:26px;margin:0;letter-spacing:-.03em}
.receipt .rh .st{font-size:15px;color:var(--muted);margin-top:4px}
.receipt .stamp{font-size:12.5px;font-weight:700;color:#fff;background:var(--major);padding:6px 13px;border-radius:999px;white-space:nowrap}
.receipt dl{display:grid;grid-template-columns:auto 1fr;gap:11px 20px;margin:0 0 20px;font-size:17px}
.receipt dt{font-weight:700;color:var(--muted);font-size:15.5px}
.receipt dd{margin:0}
.receipt .picked{border-radius:14px;background:var(--soft);padding:15px 17px;margin-bottom:18px}
.receipt .picked .one{padding:9px 0;font-size:16.5px}
.receipt .picked .one+.one{border-top:1px solid var(--line)}
.receipt .picked small{display:block;color:var(--muted);font-size:14.5px;margin-top:2px}
.receipt .pledge{font-size:15.5px;color:var(--ink2);line-height:1.75;padding:15px 17px;border-radius:14px;background:#FFF7EC;margin-bottom:18px}
.receipt .pledge div{display:flex;gap:8px}
.receipt .pledge i{font-style:normal;color:var(--major);font-weight:800}
.receipt .sign{display:flex;justify-content:flex-end;align-items:flex-end;gap:14px;padding-top:14px;border-top:1px solid var(--line)}
.receipt .sign .lab{font-size:15.5px;color:var(--muted);padding-bottom:8px}
.receipt .sign img{height:74px;max-width:220px;object-fit:contain}
@media print{
  .receipt{box-shadow:none;border:1.5px solid #333;padding:24px}
  .rprint{display:none}
}

footer{margin-top:44px;padding:24px 16px 44px;font-size:15px;color:var(--muted)}
footer .in{max-width:1320px;margin:0 auto;border-top:1px solid var(--line);padding-top:20px}

@media (max-width:640px){
  main{padding:18px 12px 104px}
  .panel{padding:16px 14px}
  .tray{margin:24px -12px -104px;padding:12px}
  .gcard{padding:22px 18px}
  h1{font-size:clamp(28px,7.5vw,36px)}
  h2{font-size:23px}
  p.lead{font-size:18px}
  body{font-size:17px}
}
@media print{.top,.tabs,.tray,footer,.tools,.scrim{display:none}body{background:#fff}.panel{break-inside:avoid;box-shadow:none;border:1px solid #ddd}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top"><div class="in">
  <div class="brand"><i class="mk"></i><b id="brandName"></b><span id="brandSchool"></span></div>
  <nav>
    <button data-nav="home">학년별 안내</button>
    <button data-nav="glossary">용어 사전</button>
  </nav>
</div></header>
<main id="app"></main>
<div id="sheet"></div>
<footer><div class="in">
  <div id="footSchool"></div>
  <div style="margin-top:6px">학교의 <b>교육과정 편제 및 학점배당표</b>를 바탕으로 만든 안내 페이지예요. 과목 설명은 이해를 돕기 위한 안내이며, 실제 학사 운영 및 시간표는 학교 안내를 따라 주세요.</div>
</div></footer>

const navHomeBtn = document.querySelector('[data-nav="home"]');
if(navHomeBtn) navHomeBtn.textContent = '학년별 안내';

const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const q1=s=>String(s).replace(/'/g,"\\'");
const sum=a=>a.reduce((x,y)=>x+y,0);
const isChoice=sec=>/택\s*1/.test(sec)||/융합\s*\(/.test(sec);

// 교육과정 데이터 보정: 원본 행을 일괄 삭제하지 않고, 확인 가능한 오류만 정밀 수정함.
const normalizeNcsSubject = name => ({
  '수출입관리':'수출입 관리',
}[name] || name);
for (const year of Object.keys(DATA)) {
  for (const dept of DATA[year]) {
    // NCS 과목명 띄어쓰기 및 이름 연결 오류를 정규화함.
    dept.ncs.forEach(n => {
      n.subject = normalizeNcsSubject(n.subject);
      // 2026학년도 보건간호과에서 요양지원 NCS가 고객 관리로 연결된 오류를 바로잡음.
      if (n.subject === '고객 관리' && /^06010108/.test(n.code) && /물품전달|환자이송지원|일상생활수행지원|신체청결지원|진료지원보조|오염물 처리/.test(n.unit)) {
        n.subject = '요양 지원';
      }
    });
    // 공동교육과정 중 학점과 학기 배정이 모두 0인 유령 행만 제외함.
    dept.rows = dept.rows.filter(r => !(r.section === '공동교육과정' && !r.credit && !r.total && r.sem.every(v => v === 0)));
    // 2026학년도 시각디자인과·모션그래픽디자인과의 후학습 지원형에 중복 삽입된 컴퓨터 그래픽 행을 제외함.
    if (year === '2026' && ['시각디자인과','모션그래픽디자인과'].includes(dept.info.dept)) {
      const hasCoreComputerGraphics = dept.rows.some(r => r.name === '컴퓨터 그래픽' && !/후학습/.test(r.section));
      if (hasCoreComputerGraphics) dept.rows = dept.rows.filter(r => !(r.name === '컴퓨터 그래픽' && /후학습/.test(r.section)));
    }
    // 선택 과정 안에서 이름·학점·학기까지 완전히 같은 중복 행만 제거함.
    const seenChoiceRows = new Set();
    dept.rows = dept.rows.filter(r => {
      if (!isChoice(r.section)) return true;
      const key = JSON.stringify([r.section,r.group,r.gid,r.name,r.credit,r.total,r.sem]);
      if (seenChoiceRows.has(key)) return false;
      seenChoiceRows.add(key); return true;
    });
    // 후학습 지원형의 다른 선택과목도 원본에서 학점·학기가 0으로 비어 있어 화면에서 누락되지 않도록 기준 과목(독서와 작문)의 편성값을 보완함.
    const postStudyRows = dept.rows.filter(r => /후학습/.test(r.section));
    const postStudyRef = postStudyRows.find(r => r.name === '독서와 작문' && (r.total || r.credit));
    if (postStudyRef) postStudyRows.forEach(r => {
      if (!r.total && !r.credit && r.sem.every(v => v === 0)) {
        r.credit = postStudyRef.credit;
        r.total = postStudyRef.total;
        r.sem = postStudyRef.sem.slice();
      }
    });
    // 쇼핑라이브커머스과의 영상 제작 기초·방송 일반은 진로 선택과목인 보통교과로 분류.
    if (year === '2027' && dept.info.dept === '쇼핑라이브커머스과') {
      dept.rows.forEach(r => {
        if (['영상 제작 기초','방송 일반'].includes(r.name)) r.section = '보통교과';
      });
    }
  }
  // 스토어기획과 서비스 마케팅 코스에서 누락된 자재 관리 NCS 능력단위를 같은 입학연도의 국제 물류 편성에서 보완함.
  const store = DATA[year].filter(d => d.info.dept === '스토어기획과');
  const service = store.find(d => d.info.course === '서비스 마케팅');
  const logistics = store.find(d => d.info.course === '국제 물류');
  if (service && logistics && !service.ncs.some(n => normalizeNcsSubject(n.subject) === '자재 관리')) {
    service.ncs.push(...logistics.ncs.filter(n => normalizeNcsSubject(n.subject) === '자재 관리').map(n => ({...n, sem:n.sem.slice()})));
  }
}


// 2027학년도 교육과정 길라잡이 수정 요청 반영: 2·3학년(입학연도 2026·2025)
for (const year of ['2025','2026']) {
  if (!DATA[year]) continue;
  for (const dept of DATA[year]) {
    const name = dept.info.dept;
    if (name === '스마트IT경영과') {
      // 선택과목 안내에서 두 번째 스토어기획과 과정(gid 110)을 제거.
      dept.rows = dept.rows.filter(r => !(isChoice(r.section) && r.gid === 110 &&
        /스토어기획과 물류와 전자 상거래 실무 과정/.test(r.group)));
    }
    if (name === '스토어기획과') {
      // 과정 (1)(gid 107)은 제거하고, 과정 (2)(gid 110)의 이름과 과목을 수정.
      dept.rows = dept.rows.filter(r => !(isChoice(r.section) && r.gid === 107));
      dept.rows.forEach(r => {
        if (isChoice(r.section) && r.gid === 110) {
          r.group = '스마트IT경영과 국제 무역과 경영 실무 과정';
        }
      });
      // 해당 과정의 창구 사무↔총무 표기를 3학년 학기별 개별 과목으로 분리.
      const combined = dept.rows.filter(r => isChoice(r.section) && r.gid === 110 &&
        r.name === '창구 사무↔총무');
      for (const r of combined) {
        const idx = dept.rows.indexOf(r);
        dept.rows.splice(idx, 1,
          {...r, name:'창구 사무', credit:4, total:4, sem:[0,0,0,0,4,0]},
          {...r, name:'총무', credit:4, total:4, sem:[0,0,0,0,0,4]}
        );
      }
    }
    if (['시각디자인과','모션그래픽디자인과'].includes(name)) {
      // 스토어기획과 물류와 전자 상거래 실무 과정의 과목은 선택과목 안내에 유지/복원.
      // 창구 사무↔총무를 3학년 1·2학기 과목으로 분리.
      const combined = dept.rows.filter(r => isChoice(r.section) && r.gid === 107 &&
        r.name === '창구 사무↔총무');
      for (const r of combined) {
        const idx = dept.rows.indexOf(r);
        dept.rows.splice(idx, 1,
          {...r, name:'창구 사무', credit:4, total:4, sem:[0,0,0,0,4,0]},
          {...r, name:'총무', credit:4, total:4, sem:[0,0,0,0,0,4]}
        );
      }
    }
  }
}

// 선택과목 안내: 스토어기획과·시각디자인과·모션그래픽디자인과의 국제 무역/물류 과정 과목 순서 통일.
for (const year of ['2025','2026']) {
  if (!DATA[year]) continue;
  for (const dept of DATA[year]) {
    if (!['스토어기획과','시각디자인과','모션그래픽디자인과'].includes(dept.info.dept)) continue;
    const groups = ['스마트IT경영과 국제 무역과 경영 실무 과정','스토어기획과 물류와 전자 상거래 실무 과정'];
    const order = ['창구 사무','총무','수출입 관리','회계 실무'];
    const norm = name => String(name || '').replace(/\s/g, '');
    for (const groupName of groups) {
      const rows = dept.rows.filter(r => isChoice(r.section) && r.group === groupName);
      if (rows.length < 2) continue;
      const rank = name => { const i = order.findIndex(x => norm(x) === norm(name)); return i < 0 ? order.length : i; };
      const sorted = rows.slice().sort((a,b) => rank(a.name)-rank(b.name));
      let at = 0;
      dept.rows = dept.rows.map(r => isChoice(r.section) && r.group === groupName ? sorted[at++] : r);
    }
  }
}

// 추가 수정: 선택과목 안내의 과목 순서를 정리하고, 디자인 계열의 스토어기획과 과정을 복원.
for (const year of ['2025','2026']) {
  if (!DATA[year]) continue;
  const depts = DATA[year];
  const storeDept = depts.find(d => d.info.dept === '스토어기획과');
  for (const dept of depts) {
    if (dept.info.dept === '스마트IT경영과') {
      const order = ['창구 사무','총무','수출입 관리','회계 실무'];
      const inGroup = dept.rows.filter(r => isChoice(r.section) && r.group === '스마트IT경영과 국제 무역과 경영 실무 과정');
      const rank = name => { const i = order.indexOf(name); return i < 0 ? order.length : i; };
      const sorted = inGroup.slice().sort((a,b) => rank(a.name)-rank(b.name));
      let at = 0;
      dept.rows = dept.rows.map(r => isChoice(r.section) && r.group === '스마트IT경영과 국제 무역과 경영 실무 과정' ? sorted[at++] : r);
    }
    if (['시각디자인과','모션그래픽디자인과'].includes(dept.info.dept) && storeDept) {
      const groupName = '스토어기획과 물류와 전자 상거래 실무 과정';
      const wanted = ['자재 관리','전자 상거래 실무','회계 실무'];
      const existing = new Set(dept.rows.filter(r => isChoice(r.section) && r.group === groupName).map(r => r.name));
      const templates = storeDept.rows.filter(r => isChoice(r.section) &&
        r.group === '스마트IT경영과 국제 무역과 경영 실무 과정' && wanted.includes(r.name));
      for (const subject of wanted) {
        if (existing.has(subject)) continue;
        const template = templates.find(r => r.name === subject);
        if (!template) continue;
        dept.rows.push({...template, group:groupName, gid:107, sem:template.sem.slice()});
      }
      // 과목은 요청한 순서대로 표시.
      const rank = name => { const i = wanted.indexOf(name); return i < 0 ? wanted.length : i; };
      const targetRows = dept.rows.filter(r => isChoice(r.section) && r.group === groupName);
      const sorted = targetRows.slice().sort((a,b) => rank(a.name)-rank(b.name));
      let at = 0;
      dept.rows = dept.rows.map(r => isChoice(r.section) && r.group === groupName ? sorted[at++] : r);
    }
  }
}

function kind(r){
  if(isChoice(r.section))return 'choice';
  if(r.section.indexOf('보통교과')===0)return 'common';
  if(r.section.indexOf('전문교과')===0)return 'major';
  return 'extra';
}
const KCOLOR={common:'var(--common)',major:'var(--major)',choice:'var(--choice)',extra:'var(--extra)'};
const KNAME={common:'보통교과',major:'전문교과',choice:'선택과목',extra:'그 밖의 과정'};
const cleanSec=s=>s.replace(/\s*\(택\s*1\)/,'').trim();
const firstGrade=sem=>{const i=sem.findIndex(v=>v>0);return i<0?0:Math.floor(i/2)+1;};

const UNITS={};
for(const y in DATA){
  const m=[];
  DATA[y].forEach(d=>{
    let u=m.find(x=>x.dept===d.info.dept);
    if(!u){u={year:y,dept:d.info.dept,info:d.info,courses:[]};m.push(u);}
    u.courses.push(d);
  });
  UNITS[y]=m;
}
const courseKey=u=>'코스|'+u.year+'|'+u.dept;
const activeIdx=u=>{
  if(u.courses.length<2)return 0;
  const p=S.picks[courseKey(u)];
  const i=u.courses.findIndex(d=>d.info.course===p);
  return i<0?0:i;
};
const active=u=>u.courses[activeIdx(u)];
const chosenCourse=u=>u.courses.length<2?null:(S.picks[courseKey(u)]||u.courses[0].info.course);

function courseDiff(u,i){
  const others=u.courses.filter((_,j)=>j!==i);
  // 선택/부전공 과목은 다른 과정의 필수 과목과 이름이 같더라도 비교 대상에서 제외함.
  // 원본 데이터 행은 삭제하지 않아 과목 누락을 방지함.
  return u.courses[i].rows.filter(r=>
    !isChoice(r.section) && others.every(o=>!o.rows.some(x=>x.name===r.name && !isChoice(x.section))));
}

function rawChoices(d){
  const secs=[];
  d.rows.forEach(r=>{
    if(!isChoice(r.section))return;
    let s=secs.find(x=>x.name===r.section);
    if(!s){s={name:r.section,opts:[]};secs.push(s);}
    const k=r.group?'g'+r.gid:'r'+r.name;
    let o=s.opts.find(x=>x.key===k);
    if(!o){o={key:k,label:r.group||r.name,rows:[]};s.opts.push(o);}
    o.rows.push(r);
  });
  secs.forEach(s=>{
    const seen={},used={}; s.dup=false;
    s.opts.forEach(o=>{seen[o.label]=(seen[o.label]||0)+1;});
    s.opts.forEach(o=>{
      const m=o.label.match(/^\((코스|융합)\)\s*/);
      if(m){o.badge=m[1]==='코스'?'세부전공 코스':'다른 학과와 융합';o.label=o.label.slice(m[0].length);}
      if(seen[o.label]>1){used[o.label]=(used[o.label]||0)+1;o.label+=' ('+used[o.label]+')';s.dup=true;}
    });
    const ref=s.opts.find(o=>sum(o.rows.map(r=>r.total||r.credit))>0);
    s.opts.forEach(o=>{
      o.credit=sum(o.rows.map(r=>r.total||r.credit));
      o.sem=[0,0,0,0,0,0]; o.rows.forEach(r=>r.sem.forEach((v,i)=>o.sem[i]+=v));
      o.assumed=false;
      if(!o.credit&&ref){o.credit=ref.credit;o.sem=ref.sem.slice();o.assumed=true;}
    });
    s.same=s.opts.every(o=>o.credit===s.opts[0].credit);
  });
  return secs;
}

function sections(u){
  const out=[];
  if(u.courses.length>1){
    const opts=u.courses.map((d,i)=>{
      const rows=courseDiff(u,i);
      const sem=[0,0,0,0,0,0]; rows.forEach(r=>r.sem.forEach((v,k)=>sem[k]+=v));
      return {key:d.info.course,label:d.info.course,rows,sem,credit:sum(rows.map(r=>r.total||r.credit)),assumed:false};
    });
    const sem=[0,0,0,0,0,0]; opts.forEach(o=>o.sem.forEach((v,k)=>sem[k]+=v));
    out.push({name:'전공 코스',key:courseKey(u),opts,grade:firstGrade(sem),isCourse:true,
      same:opts.every(o=>o.credit===opts[0].credit),dup:false});
  }
  const d=active(u);
  rawChoices(d).forEach(s=>{
    const sem=[0,0,0,0,0,0]; s.opts.forEach(o=>o.sem.forEach((v,k)=>sem[k]+=v));
    s.key='택1|'+u.year+'|'+u.dept+'|'+(u.courses.length>1?d.info.course:'')+'|'+s.name;
    s.grade=firstGrade(sem);
    out.push(s);
  });
  return out;
}
const activeSecs=u=>sections(u).filter(s=>s.grade>0);
const unsetOf=u=>sections(u).filter(s=>s.grade===0);
const hiddenSecs=u=>new Set(unsetOf(u).map(s=>s.name));
const visibleRows=u=>{const h=hiddenSecs(u);return active(u).rows.filter(r=>!h.has(r.section));};

let S={view:'home',year:null,ui:0,tab:'overview',picks:{},q:'',filter:'all',sheet:null};

function readHash(){
  const h=location.hash.replace(/^#\/?/,'').split('/');
  if(h[0]==='glossary'){S.view='glossary';return;}
  if(h[0]==='year'&&UNITS[h[1]]){S.view='depts';S.year=h[1];
    if(h[2]!==undefined&&UNITS[h[1]][+h[2]]){S.view='dept';S.ui=+h[2];S.tab=h[3]||'overview';}
    return;}
  S.view='home';
}
const go=h=>{location.hash=h;};
const crumb=(items,cur)=>`<div class="crumb">${items.map(([h,t])=>`<button onclick="go('${h}')">${esc(t)}</button><i>›</i>`).join('')}<span>${esc(cur)}</span></div>`;
const nameBtn=n=>`<button class="namebtn" onclick="openSub('${esc(q1(n))}')">${esc(n)}</button>`;

function openSub(name){S.sheet=name;renderSheet();}
function closeSub(){S.sheet=null;renderSheet();}
function renderSheet(){
  const el=document.getElementById('sheet');
  if(!S.sheet){el.innerHTML='';return;}
  const name=S.sheet;
  const u=(S.view==='dept')?UNITS[S.year][S.ui]:null;
  const d=u?active(u):null;
  const rows=d?d.rows.filter(x=>x.name===name):[];
  const r=rows[0]||null;
  const desc=DESC[name]||DESC[normalizeNcsSubject(name)]||[];
  const aliases = name==='창구 사무↔총무' ? ['창구 사무','총무'] : (name==='총무↔인사' ? ['총무','인사'] : [normalizeNcsSubject(name)]);
  const units=d?d.ncs.filter(x=>aliases.includes(normalizeNcsSubject(x.subject))):[];
  const tags=rows.map(row=>{
    const k=kind(row); const out=[
      '<span class="tag" style="background:'+KCOLOR[k]+'">'+KNAME[k]+'</span>'
    ];
    if(row.kgroup)out.push('<span class="tag" style="background:#EEF2F9;color:var(--ink2)">'+esc(row.kgroup)+'</span>');
    if(row.gubun)out.push('<span class="tag" style="background:#EEF2F9;color:var(--ink2)">'+esc(row.gubun)+'</span>');
    return '<div style="display:flex;gap:5px;flex-wrap:wrap;margin:4px 0">'+out.join('')+'</div>';
  }).join('');
  const creditDetails=rows.map(row=>{
    const when=row.sem.map((v,i)=>v?SEMS[i]+' '+v+'학점':null).filter(Boolean);
    const cr=row.total||row.credit;
    return '<div style="padding:9px 0;border-top:1px solid var(--line)"><div style="font-size:13px;color:var(--muted);margin-bottom:4px">'+esc(row.section)+'</div>'+
      (cr?'<div>이수학점 <b style="color:var(--ink)">'+cr+'학점</b></div>':'')+
      (when.length?'<div style="font-size:13px;color:var(--muted);margin-top:3px">'+when.join(', ')+'</div>':'')+'</div>';
  }).join('');
  el.innerHTML='<div class="scrim" onclick="if(event.target===this)closeSub()"><div class="sheet" role="dialog" aria-modal="true" style="position:relative">'+
    '<button class="close" onclick="closeSub()" aria-label="닫기" style="font-size:22px;color:var(--muted);line-height:1">×</button>'+tags+'<h3>'+esc(name)+'</h3>'+ 
    '<div class="body">'+(desc.length?desc.map(p=>'<p>'+esc(p)+'</p>').join(''):'<p>아직 설명이 등록되지 않았어요.</p>')+'</div>'+ 
    (units.length?'<div class="meta">이 과목에서 배우는 능력단위 '+units.length+'개예요. 회사에서 실제로 하는 일의 단위랍니다.<ul class="units">'+units.map(x=>'<li>'+esc(x.unit)+'<span>'+(x.total?x.total+'학점':'')+'</span></li>').join('')+'</ul></div>':'')+
    (rows.length?'<div class="meta">'+creditDetails+'</div>':'')+

document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.sheet)closeSub();});

const TABS=[['overview','한눈에 보기'],['roadmap','학기별로 보기'],['choice','선택과목 안내'],['table','전체 편제표'],['ncs','실무과목 속내용']];
function viewDept(){
  const y=S.year,u=UNITS[y][S.ui],g=GRADES.find(x=>x.year===y),d=active(u);
  const tabs=TABS.filter(t=>t[0]!=='ncs'||d.ncs.length)
    .map(([k,l])=>`<button class="${S.tab===k?'on':''}" onclick="setTab('${k}')">${l}</button>`).join('');
  const body={overview:tabOverview,roadmap:tabRoadmap,choice:tabChoice,table:tabTable,ncs:tabNcs}[S.tab](u);
  return `${crumb([['#/','학년별 안내'],['#/year/'+y,CONFIG.schoolYear+'학년도 '+g.g+'학년']],u.dept)}
    <h1>${esc(u.dept)}</h1>
    <p class="lead">${CONFIG.schoolYear}학년도 ${g.g}학년(${y}학년도 입학생)이 이수하는 교육과정이에요.${(u.info.jobs&&u.info.jobs.length)?' 졸업 후에는 주로 '+u.info.jobs.map(esc).join(', ')+' 분야로 진출해요.':''}</p>
    ${courseBar(u)}
    <div class="tabs">${tabs}</div>${body}`;
}
function setTab(t){S.tab=t;go('#/year/'+S.year+'/'+S.ui+'/'+t);}

function courseBar(u){
  if(u.courses.length<2 || ['스마트IT경영과','스토어기획과'].includes(u.dept))return '';
  const cur=chosenCourse(u);
  return `<div class="locked" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
    <b>전공 코스별 보기</b>
    <span style="font-size:13.5px;color:var(--muted)">코스를 누르면 해당 코스의 학기별 과목과 편제표를 확인할 수 있어요.</span>
    <span style="margin-left:auto;display:flex;gap:6px;flex-wrap:wrap">
      ${u.courses.map(d=>`<button class="chip${cur===d.info.course?' on':''}" onclick="setCourse('${esc(q1(d.info.course))}')">${esc(d.info.course)}</button>`).join('')}
    </span></div>`;
}
function setCourse(c){
  const u=UNITS[S.year][S.ui];
  S.picks[courseKey(u)]=c; render();
}

function tabOverview(u){
  const d=active(u),t=d.totals;
  const c=t['보통교과 이수 합계'],m=t['전문교과 이수 합계'],a=t['교과 총 이수 합계'];
  const cT=c?c[1]:0,mT=m?m[1]:0,aT=a?a[1]:cT+mT,cR=c?c[2]:0,mR=m?m[2]:0;
  const semRow=a?a[0].map((v,i)=>`<div class="sem"><div class="hd"><b>${SEMS[i]}</b><em>${v}학점</em></div>
    <div style="font-size:13px;color:var(--muted)">보통교과 ${c?c[0][i]:0} · 전문교과 ${m?m[0][i]:0}</div></div>`).join(''):'';
  const secs=activeSecs(u);
  return `<div class="panel"><h3>학점이 이렇게 나뉘어요</h3>
    <p class="hint">교과 ${aT}학점에 창의적 체험활동 18학점을 더하면 192학점, 그러면 졸업이에요. 괄호 안은 반드시 채워야 하는 최소 학점이에요.</p>
    <div class="stack"><div style="flex:${cT};background:var(--common)">보통교과 ${cT}</div><div style="flex:${mT};background:var(--major)">전문교과 ${mT}</div></div>
    <div class="legend"><span><i class="dot" style="background:var(--common)"></i>보통교과 ${cT}학점 (최소 ${cR})</span>
      <span><i class="dot" style="background:var(--major)"></i>전문교과 ${mT}학점 (최소 ${mR})</span></div></div>

  <div class="panel"><h3>학기마다 듣는 양은 같아요</h3>
    <p class="hint">여섯 학기 모두 교과 ${a?a[0][0]:29}학점씩이에요. 여기에 창의적 체험활동 3학점이 붙어서 한 학기 32학점이 돼요.</p>
    <div class="sems">${semRow}</div></div>

  <div class="panel"><h3>선택·코스 과정 안내</h3>
    ${secs.length?`<p class="hint">이 교육과정에는 아래와 같은 코스 및 선택과목 과정이 편성되어 있어요.</p>
      <ul style="list-style:none;padding:0;margin:0 0 18px">${secs.map(s=>`<li style="padding:10px 0;border-top:1px solid var(--line);font-size:14.5px">
        <b>${esc(cleanSec(s.name))}</b> — ${s.opts.length}개 과정 중 택1
        <span style="color:var(--muted)"> · ${s.grade}학년 과정 (${s.opts.map(o=>esc(o.label)).join(', ')})</span></li>`).join('')}</ul>
      <button class="chip on" onclick="setTab('choice')">선택과목 자세히 보기</button>`
      :`<p class="hint">별도의 선택 묶음 없이 공통 편제된 과목들을 이수해요.</p>`}
  </div>`;
}

function tabRoadmap(u){
  const d=active(u), vis=visibleRows(u);
  const totRow=d.totals['교과 총 이수 합계'];
  const cols=SEMS.map((label,i)=>{
    const fixed=vis.filter(r=>!isChoice(r.section)&&!r.extra&&r.sem[i]>0);
    const choiceRows=vis.filter(r=>isChoice(r.section)&&!r.extra&&r.sem[i]>0);
    const tot=totRow?totRow[0][i]:sum(fixed.map(r=>r.sem[i]));
    const fixedHtml=fixed.sort((x,y)=>y.sem[i]-x.sem[i])
      .map(r=>`<button class="sub" onclick="openSub('${esc(q1(r.name))}')">
        <i class="tick" style="background:${KCOLOR[kind(r)]}"></i><span>${esc(r.name)}</span><span class="cr">${r.sem[i]}</span></button>`).join('');
    let choiceHtml='';
    if(choiceRows.length){
      const bySec={};
      choiceRows.forEach(r=>{(bySec[r.section]=bySec[r.section]||[]).push(r);});
      choiceHtml=Object.entries(bySec).map(([sec,list])=>{
        const uniq=[];
        list.forEach(r=>{if(!uniq.some(x=>x.name===r.name))uniq.push(r);});
        return `<div style="margin-top:8px;padding:8px;border-radius:12px;background:#FFF8EE;border:1px dashed #EFC286">
          <div style="font-size:12.5px;font-weight:700;color:#8A5A17;margin-bottom:6px;padding:0 4px">${esc(cleanSec(sec))} (선택)</div>
          ${uniq.map(r=>`<button class="sub pick" style="margin-bottom:4px" onclick="openSub('${esc(q1(r.name))}')">
            <i class="tick" style="background:var(--choice)"></i><span>${esc(r.name)}</span><span class="cr">${r.sem[i]}</span></button>`).join('')}
        </div>`;
      }).join('');
    }
    return `<div class="sem"><div class="hd"><b>${label}</b><em>${tot}학점</em></div>${(fixedHtml+choiceHtml)||'<div style="font-size:13px;color:var(--muted)">편성 없음</div>'}</div>`;
  }).join('');
  return `<div class="panel"><h3>3년을 여섯 학기로 펼쳐봤어요</h3>
    <p class="hint">${u.courses.length>1?`<b>${esc(active(u).info.course)}</b> 코스 기준이에요. `:''}과목을 누르면 어떤 걸 배우는지 볼 수 있어요. 노란색 점선 칸은 해당 학기에 운영되는 선택과목 후보들이에요.</p>
    <div class="sems">${cols}</div>
    <div class="legend" style="margin-top:16px">
      <span><i class="dot" style="background:var(--common)"></i>보통교과</span>
      <span><i class="dot" style="background:var(--major)"></i>전문교과</span>
      <span><i class="dot" style="background:var(--choice)"></i>선택과목</span></div></div>`;
}

function optCard(s,o){
  const li=o.rows.map(r=>`<li><span>${esc(r.name)}</span><b>${(r.total||r.credit)||(o.assumed?o.credit:0)}학점</b></li>`).join('');
  const when=o.sem.map((v,i)=>v?SEMS_S[i]:null).filter(Boolean).join(', ');
  return `<div class="opt">
    <div>
      <div class="t">${esc(o.label)}</div>
      ${o.badge?`<div style="margin-top:7px"><span class="tag" style="background:${o.badge==='세부전공 코스'?'var(--major)':'var(--ncs)'}">${o.badge}</span></div>`:''}
    </div>
    <ul>${li}</ul>
    <div class="foot">모두 ${o.credit}학점 · ${when||'편성 학기 미정'}${o.assumed?' (학교 편성 기준 학점)':''}</div>
    <div style="margin-top:10px;font-size:13px">${o.rows.map(r=>nameBtn(r.name)).join(' · ')}</div>
  </div>`;
}

function tabChoice(u){
  const secs=activeSecs(u);
  if(!secs.length){
    return `<div class="panel"><h3>선택과목 안내</h3>
      <p class="hint">이 학과는 별도로 갈라지는 선택과목 묶음 없이 단일 과정으로 과목이 편성되어 있어요.</p>
      <p class="hint" style="margin-top:18px"><button class="link" onclick="setTab('roadmap')">학기별로 보기</button>에서 3년 전체 흐름을 볼 수 있어요.</p></div>`;
  }
  const blocks=secs.map(s=>`<div class="panel">
    <h3>${esc(cleanSec(s.name))}
      <span style="font-weight:600;color:var(--muted);font-size:15px">${s.grade}학년 과정</span></h3>
    <p class="hint">${s.opts.length}개 과정 중 하나를 이수하게 돼요.${s.isCourse?' 코스에 따라 2학년 2학기부터 배우는 전공과목이 달라져요.':''}${s.same?' 어느 과정을 이수하든 총 학점 수는 같아요.':''}
      과목 이름을 누르면 어떤 걸 배우는지 볼 수 있어요.</p>
    <div class="opts">${s.opts.map(o=>optCard(s,o)).join('')}</div></div>`).join('');
  return blocks;
}

function tabTable(u){
  const d=active(u), q=S.q.trim(), all=visibleRows(u);
  const rows=all.filter(r=>(S.filter==='all'||kind(r)===S.filter)&&(!q||(r.name+r.kgroup+r.section+r.gubun).includes(q)));
  let last='';
  const body=rows.map(r=>{
    const head=(r.section+'|'+r.group)!==last; last=r.section+'|'+r.group;
    const k=kind(r);
    const hr=head?`<tr class="grp"><td colspan="10"><span class="tag" style="background:${KCOLOR[k]}">${KNAME[k]}</span> ${esc(r.section)}${r.group?' · '+esc(r.group):''}</td></tr>`:'';
    return hr+`<tr class="row"><td>${esc(r.kgroup)}</td><td>${esc(r.gubun)}</td><td>${nameBtn(r.name)}</td>
      <td class="num">${r.total||r.credit||'·'}</td>
      ${r.sem.map(v=>`<td class="num" style="${v?'font-weight:700':'color:#C9D3E0'}">${v||'·'}</td>`).join('')}</tr>`;
  }).join('');
  const chips=[['all','전체'],['common','보통교과'],['major','전문교과'],['choice','선택과목'],['extra','그 밖']]
    .filter(([k])=>k==='all'||all.some(r=>kind(r)===k))
    .map(([k,l])=>`<button class="chip${S.filter===k?' on':''}" onclick="setFilter('${k}')">${l}</button>`).join('');
  return `<div class="panel"><h3>전체 편제표</h3>
    <p class="hint">${u.courses.length>1?`<b>${esc(d.info.course)}</b> 코스 기준이에요. `:''}우리 학과가 3년 동안 배우는 과목 전부예요. 숫자는 그 학기에 듣는 학점이고, 과목 이름을 누르면 설명이 나와요.</p>
    <div class="tools"><input id="q" placeholder="과목 이름 찾기" value="${esc(S.q)}" oninput="setQ(this.value)">${chips}</div>
    <div class="tw"><table><thead><tr><th>교과(군)</th><th>구분</th><th>과목</th><th class="num">이수</th>
    ${SEMS_S.map(s=>`<th class="num">${s}</th>`).join('')}</tr></thead>
    <tbody>${body||'<tr><td colspan="10" style="color:var(--muted)">찾는 과목이 없어요. 다른 이름으로 찾아보세요.</td></tr>'}</tbody></table></div>
    <p class="hint" style="margin:14px 0 0">모두 ${rows.length}개 과목</p></div>`;
}
function setQ(v){S.q=v;render();const el=document.getElementById('q');if(el){el.focus();el.setSelectionRange(v.length,v.length);}}
function setFilter(k){S.filter=k;render();}

function tabNcs(u){
  const d=active(u), by={};
  d.ncs.forEach(r=>{(by[r.subject]=by[r.subject]||[]).push(r);});
  const blocks=Object.entries(by).map(([sub,list])=>{
    const desc=DESC[sub]?DESC[sub][0]:'';
    return `<div class="panel"><h3>${nameBtn(sub)} <span style="font-weight:600;color:var(--muted);font-size:14px">${sum(list.map(r=>r.total))}학점</span></h3>
      ${desc?`<p class="hint">${esc(desc)}</p>`:''}
      <div class="tw"><table style="min-width:600px"><thead><tr><th>능력단위</th><th>코드</th><th class="num">학점</th>
      ${SEMS_S.map(s=>`<th class="num">${s}</th>`).join('')}</tr></thead><tbody>
      ${list.map(r=>`<tr class="row"><td style="font-weight:600">${esc(r.unit)}</td><td style="color:var(--muted);font-size:12.5px">${esc(r.code)}</td>
        <td class="num">${r.total||'·'}</td>
        ${r.sem.map(v=>`<td class="num" style="${v?'font-weight:700':'color:#C9D3E0'}">${v||'·'}</td>`).join('')}</tr>`).join('')}
      </tbody></table></div></div>`;
  }).join('');
  return `<div class="panel"><h3>실무과목은 '능력단위'로 배워요</h3>
    <p class="hint">전공실무 과목은 회사에서 실제로 하는 일을 잘게 나눈 단위를 그대로 가져와 배워요. 그래서 여기 적힌 내용이 자격증 시험과 취업 면접에서 그대로 쓰여요.</p></div>${blocks}`;
}

const TERMS=[
 ['학점','한 학기에 16번 수업을 듣는 양이 1학점이에요. 4학점 과목이면 일주일에 네 시간씩 한 학기를 배워요.','3년 동안 192학점을 채우면 졸업이에요. 교과 174학점에 창의적 체험활동 18학점이죠.'],
 ['기준학점과 운영학점','기준학점은 나라에서 정해 둔 기본값이고, 운영학점은 학교가 범위 안에서 조절한 실제 학점이에요.','편제표에 "3~5"처럼 적힌 게 조절할 수 있는 범위예요.'],
 ['이수학점','실제로 그 과목을 듣고 인정받는 학점이에요. 편제표 오른쪽 숫자가 그거예요.'],
 ['필수 이수학점','반드시 채워야 하는 최소한의 학점이에요. 보통교과 64학점, 전문교과 80학점이 기준이에요.'],
 ['보통교과','국어·수학·영어·사회·과학·체육·예술·정보처럼 모든 고등학생이 배우는 과목이에요.','공통과목, 일반선택, 진로선택, 융합선택으로 나뉘어요.'],
 ['전문교과','학과 전공을 배우는 과목이에요. 직업계고 학생이 다 듣는 전문공통, 전공 이론인 전공일반, 실습 위주인 전공실무가 있어요.'],
 ['전공일반과 전공실무','전공일반은 전공의 기본 개념을 배우고, 전공실무는 현장에서 하는 일을 그대로 실습해요.','전공실무는 대체로 2·3학년에 몰려 있어요.'],
 ['능력단위 (NCS)','회사에서 한 사람이 해내야 하는 일을 잘게 나눈 단위예요. 전공실무 과목은 이걸 묶어서 만들어요.','예를 들어 "회계 실무"는 전표관리, 자금관리, 원가계산, 결산처리로 이뤄져 있어요.'],
 ['전공 코스','같은 학과 안에서 진로에 따라 갈라지는 길이에요. 코스에 따라 배우는 전공과목이 달라져요.'],
 ['세부전공 코스형','같은 학과 안에서 진로에 따라 갈라지는 심화 코스예요. 주로 2학년 2학기나 3학년 실무과목이 달라져요.'],
 ['타학과 융합형','다른 학과의 전공과목을 묶어서 듣는 방식이에요. 내 전공에 다른 분야를 더할 수 있도록 구성된 과정이에요.'],
 ['부전공 이수형','주전공 말고 다른 분야를 한 묶음 더 배우는 방식이에요.'],
 ['후학습 지원형','졸업하고 나서 대학이나 이어지는 공부를 준비할 수 있게 넣어 둔 보통교과 선택과목이에요.'],
 ['공동교육과정','우리 학교에 없는 과목을 다른 학교나 공동실습소에서 듣는 방식이에요. 방과후나 주말에 하는 경우가 많아요.'],
 ['창의적 체험활동','자율·자치활동, 동아리활동, 진로활동이에요. 3년 동안 18학점, 시간으로는 288시간을 채워요.'],
 ['공통·일반선택·진로선택·융합선택','공통과목은 1학년에 다 같이 들어요. 일반선택은 교과의 기본, 진로선택은 진로에 맞춘 심화, 융합선택은 여러 교과를 엮은 과목이에요.'],
];
function viewGlossary(){
  return `${crumb([['#/','학년별 안내']],'용어 사전')}
    <h1>낯선 말들, 짧게 풀었어요</h1>
    <p class="lead">편제표에 나오는 말이 어렵게 느껴질 때 여기서 찾아보세요.</p>
    <div class="terms">${TERMS.map(t=>`<div class="term"><h3>${esc(t[0])}</h3>${t.slice(1).map(p=>`<p>${esc(p)}</p>`).join('')}</div>`).join('')}</div>
    <div class="tip" style="margin-top:24px"><b>교육과정을 볼 때 이 세 가지를 확인해 보세요.</b><br>
      하나, 내가 관심 있는 진로·직무와 어떻게 이어지는가.<br>둘, 어느 학기에 배우는가.<br>셋, 몇 학점인가.<br>
      셋 다 학과 페이지에서 한눈에 볼 수 있어요.</div>`;
}

function render(){
  document.getElementById('app').innerHTML=
    S.view==='home'?viewHome():S.view==='depts'?viewDepts():S.view==='dept'?viewDept():viewGlossary();
  document.querySelectorAll('.top nav button').forEach(b=>b.classList.toggle('on',(b.dataset.nav==='glossary')===(S.view==='glossary')));
  renderSheet();
}
document.querySelectorAll('.top nav button').forEach(b=>{b.onclick=()=>{S.sheet=null;go(b.dataset.nav==='glossary'?'#/glossary':'#/');}});
window.addEventListener('hashchange',()=>{S.sheet=null;readHash();render();window.scrollTo(0,0);});
readHash();render();
</script>
